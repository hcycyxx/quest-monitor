    const icon=edgeTab.querySelector('svg');
    if(icon)icon.style.transform=state.edgeSide==='left'?'rotate(180deg)':'';
  }
  function revealEdge(){cancelEdgeHide();state.edgeHidden=false;updateEdge();}
  function scheduleEdgeHide(){
    cancelEdgeHide();
    if(!edgeActive()||state.edgeHidden)return;
    edgeTimer=setTimeout(()=>{
      edgeTimer=0;
      if(!edgeActive()||gesture||pointerOverWindow())return;
      const focus=document.activeElement;
      if(state.settings||!q('#sq-menu').hidden||scrollFrame||(keyboardMode&&win.contains(focus))||(win.contains(focus)&&focus.matches('input,textarea,select')))return;
      stopScroll();state.edgeHidden=true;updateEdge();
    },750);
  }
  function dockTo(side){
    cancelEdgeHide();state.edgeSide=side;state.edgeHidden=false;applyGeometry();scheduleEdgeHide();remember();
  }
  win.addEventListener('pointerenter',()=>revealEdge());
  win.addEventListener('pointerleave',scheduleEdgeHide);
  stage.addEventListener('pointermove',e=>{
    pointerX=e.clientX;pointerY=e.clientY;
    if(!edgeActive()||e.pointerType!=='mouse')return;
    const rect=stage.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    const nearEdge=(state.edgeSide==='left'?x<=22:x>=rect.width-22)&&y>=state.y+12&&y<=state.y+120;
    if(nearEdge){revealEdge();return;}
    if(!state.edgeHidden){if(pointerOverWindow())cancelEdgeHide();else if(!edgeTimer)scheduleEdgeHide();}
  });
  stage.addEventListener('pointerleave',()=>{pointerX=-1;pointerY=-1;scheduleEdgeHide();});
  edgeTab.addEventListener('pointerenter',()=>revealEdge());
  edgeTab.addEventListener('focus',()=>{revealEdge();q('[data-action=menu]').focus({preventScroll:true});});
  root.addEventListener('keydown',e=>{if(e.key==='Tab'){keyboardMode=true;cancelEdgeHide();}});
  root.addEventListener('pointerdown',e=>{keyboardMode=false;pointerX=e.clientX;pointerY=e.clientY;});
  win.addEventListener('focusout',()=>setTimeout(()=>{if(!win.contains(document.activeElement))scheduleEdgeHide();},0));
  function stopScroll(){if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;scrollTarget=viewport.scrollTop;}
  function applyGeometry(){
    const available=Math.max(1,stage.clientWidth-16);
    const minWidth=Math.min(300,available);
    state.width=Math.max(minWidth,Math.min(state.width,available));
    if(state.x===null)state.x=(stage.clientWidth-state.width)/2;
    if(state.edgeSide==='left')state.x=8;
    if(state.edgeSide==='right')state.x=stage.clientWidth-state.width-8;
    state.x=Math.max(8,Math.min(state.x,stage.clientWidth-state.width-8));
    state.y=Math.max(8,Math.min(state.y,stage.clientHeight-180));
    state.height=Math.max(240,Math.min(state.height,stage.clientHeight-state.y-12));
    win.style.width=state.width+'px';win.style.left=state.x+'px';win.style.top=state.y+'px';
    win.style.maxHeight=state.height+'px';
    updateEdge();
    grip.hidden=state.minimized;
  }
  function beginGesture(e,kind){
    if(e.button!==0)return;
    if(kind==='move'&&e.target.closest('button,input,select,summary,a'))return;
    cancelEdgeHide();revealEdge();
    if(kind==='move'){state.edgeSide=null;state.edgeHidden=false;applyGeometry();}
    stopScroll();closeMenu();
    if(kind==='resize'){state.width=win.getBoundingClientRect().width;state.height=win.getBoundingClientRect().height;}
    gesture={kind,id:e.pointerId,element:e.currentTarget,startX:e.clientX,startY:e.clientY,x:state.x,y:state.y,width:state.width,height:state.height};
    e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault();
    root.classList.add('sq-manipulating');
  }
  function moveGesture(e){
    if(!gesture||gesture.id!==e.pointerId)return;
    const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;
    if(gesture.kind==='move'){
      state.x=gesture.x+dx;
      const h=win.getBoundingClientRect().height;
      state.y=Math.max(8,Math.min(gesture.y+dy,stage.clientHeight-h-8));
    }else{
      state.width=Math.min(gesture.width+dx,stage.clientWidth-gesture.x-8);
      state.height=gesture.height+dy;
    }
    applyGeometry();
  }
  function endGesture(e){
    if(!gesture||(e.pointerId!==undefined&&gesture.id!==e.pointerId))return;
    const g=gesture;gesture=null;root.classList.remove('sq-manipulating');
    if(g.element.hasPointerCapture(g.id))g.element.releasePointerCapture(g.id);
    if(g.kind==='move'){
      const leftDistance=state.x-8,rightDistance=stage.clientWidth-state.width-8-state.x;
      if(Math.min(leftDistance,rightDistance)<=24)dockTo(leftDistance<=rightDistance?'left':'right');
    }
    scheduleEdgeHide();remember();
  }
  toolbar.addEventListener('pointerdown',e=>beginGesture(e,'move'));
  grip.addEventListener('pointerdown',e=>beginGesture(e,'resize'));
  [toolbar,grip].forEach(el=>{el.addEventListener('pointermove',moveGesture);el.addEventListener('pointerup',endGesture);el.addEventListener('pointercancel',endGesture);el.addEventListener('lostpointercapture',endGesture);});
  window.addEventListener('blur',()=>{if(gesture)endGesture({pointerId:gesture.id});stopScroll();});
  grip.addEventListener('keydown',e=>{
    const amount=e.shiftKey?24:8;
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
    e.preventDefault();e.stopPropagation();
    state.width=win.getBoundingClientRect().width;state.height=win.getBoundingClientRect().height;
    if(e.key==='ArrowLeft')state.width-=amount;if(e.key==='ArrowRight')state.width+=amount;
    if(e.key==='ArrowUp')state.height-=amount;if(e.key==='ArrowDown')state.height+=amount;
    state.width=Math.min(state.width,stage.clientWidth-state.x-8);applyGeometry();remember();
  });
  viewport.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.shiftKey||e.deltaX||e.target.closest('input,textarea,select')||reduceMotion())return;
    if(e.deltaMode===0&&Math.abs(e.deltaY)<50){stopScroll();return;}
    const maximum=Math.max(0,viewport.scrollHeight-viewport.clientHeight);
    const delta=e.deltaY*(e.deltaMode===1?18:e.deltaMode===2?viewport.clientHeight:1);
    if(!maximum||(viewport.scrollTop<=0&&delta<0)||(viewport.scrollTop>=maximum-1&&delta>0)){stopScroll();return;}
    e.preventDefault();
    if(!scrollFrame||Math.sign(delta)!==Math.sign(scrollTarget-viewport.scrollTop))scrollTarget=viewport.scrollTop;
    scrollTarget=Math.max(0,Math.min(maximum,scrollTarget+delta));
    if(scrollFrame)return;
    scrollTime=performance.now();
    function tick(now){
      const elapsed=Math.min(now-scrollTime,50);scrollTime=now;
      scrollTarget=Math.min(scrollTarget,Math.max(0,viewport.scrollHeight-viewport.clientHeight));
      const gap=scrollTarget-viewport.scrollTop;
      if(Math.abs(gap)<.7){viewport.scrollTop=scrollTarget;scrollFrame=0;return;}
      const before=viewport.scrollTop;
      viewport.scrollTop=before+gap*(1-Math.exp(-elapsed/60));
      if(elapsed>5&&Math.abs(viewport.scrollTop-before)<.1){viewport.scrollTop=scrollTarget;scrollFrame=0;return;}
      scrollFrame=requestAnimationFrame(tick);
    }
    scrollFrame=requestAnimationFrame(tick);
  },{passive:false});
  viewport.addEventListener('pointerdown',stopScroll,{passive:true});
  viewport.addEventListener('touchstart',stopScroll,{passive:true});
  viewport.addEventListener('keydown',stopScroll);
  if(globalThis.ResizeObserver)new ResizeObserver(()=>applyGeometry()).observe(stage);
  if(Number.isFinite(saved.width))state.width=saved.width;
  if(Number.isFinite(saved.height))state.height=saved.height;
  if(Number.isFinite(saved.x))state.x=saved.x;
  if(Number.isFinite(saved.y))state.y=saved.y;
  if(['left','right'].includes(saved.edgeSide))state.edgeSide=saved.edgeSide;
  if(typeof saved.autoHide==='boolean')state.docked=saved.autoHide;

  // Animated Text Disclosure: keep native summary activation and measure real contents.
  const stepsPanel=q('.sq-steps'),stepsSummary=stepsPanel.querySelector('summary');
  const stepsBody=q('#sq-step-content'),stepsInner=stepsBody.querySelector('.sq-step-list');
  const stepsMotion={raf:0,x:0,velocity:0,time:0};
  function settleSteps(){
    if(stepsMotion.raf)cancelAnimationFrame(stepsMotion.raf);
    stepsMotion.raf=0;stepsMotion.velocity=0;
    stepsBody.style.height='';stepsBody.style.overflow='';
    stepsBody.hidden=!state.stepsOpen;stepsBody.inert=!state.stepsOpen;
    stepsBody.setAttribute('aria-hidden',String(!state.stepsOpen));
    stepsPanel.open=state.stepsOpen;
    stepsSummary.setAttribute('aria-expanded',String(state.stepsOpen));
  }
  function animateSteps(){
    stopScroll();cancelEdgeHide();
    if(!state.stepsOpen&&stepsBody.contains(document.activeElement))stepsSummary.focus({preventScroll:true});
    stepsSummary.setAttribute('aria-expanded',String(state.stepsOpen));
    stepsBody.inert=!state.stepsOpen;stepsBody.setAttribute('aria-hidden',String(!state.stepsOpen));
    if(reduceMotion()){settleSteps();return;}
    const wasClosed=stepsBody.hidden||!stepsPanel.open;
    stepsMotion.x=wasClosed?0:stepsBody.getBoundingClientRect().height;
    if(stepsMotion.raf)cancelAnimationFrame(stepsMotion.raf);
    if(wasClosed)stepsMotion.velocity=0;
    stepsPanel.open=true;stepsBody.hidden=false;
    stepsBody.style.height=stepsMotion.x+'px';stepsBody.style.overflow='hidden';
    stepsMotion.time=performance.now();
    function frame(now){
      if(reduceMotion()||!stepsInner.getClientRects().length){settleSteps();return;}
      // Remeasure while moving, so resizing and font changes cannot leave a stale endpoint.
      const destination=state.stepsOpen?stepsInner.getBoundingClientRect().height:0;
      const dt=Math.min((now-stepsMotion.time)/1000,.04);stepsMotion.time=now;
      const omega=10.5,offset=stepsMotion.x-destination;
      const coefficient=stepsMotion.velocity+omega*offset,decay=Math.exp(-omega*dt);
      stepsMotion.x=destination+(offset+coefficient*dt)*decay;
      stepsMotion.velocity=(stepsMotion.velocity-omega*coefficient*dt)*decay;
      if(stepsMotion.x<0){stepsMotion.x=0;stepsMotion.velocity=0;}
      stepsBody.style.height=stepsMotion.x+'px';
      if(Math.abs(stepsMotion.x-destination)<.4&&Math.abs(stepsMotion.velocity)<4){settleSteps();scheduleEdgeHide();return;}
      stepsMotion.raf=requestAnimationFrame(frame);
    }
    stepsMotion.raf=requestAnimationFrame(frame);
  }
  stepsSummary.addEventListener('click',e=>{
    e.preventDefault();state.stepsOpen=!state.stepsOpen;animateSteps();remember();
  });
  const stepsMedia=window.matchMedia('(prefers-reduced-motion: reduce)');
  if(stepsMedia.addEventListener)stepsMedia.addEventListener('change',()=>{if(stepsMedia.matches)settleSteps();});
  settleSteps();
  render();scheduleEdgeHide();
  if(globalThis.Tweak){const tweak=new Tweak({container:q('.sq-window'),onChange:render});tweak.addSelect(state,'skin',{label:'皮肤',options:[{label:'深蓝玻璃',value:'glass'},{label:'轻透悬浮',value:'transparent'},{label:'杂志手账',value:'journal'},{label:'夜航 HUD',value:'night'}]});tweak.addSlider(state,'density',{label:'留白',min:.8,max:1.3,step:.1});}
})();
</script>
